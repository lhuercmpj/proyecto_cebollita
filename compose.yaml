services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cebollita}
      POSTGRES_USER: ${POSTGRES_USER:-cebollita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cebollita_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cebollita} -d ${POSTGRES_DB:-cebollita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.simulator:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      SENSOR_API_KEY: ${SENSOR_API_KEY:-change-me-too}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; r=urllib.request.Request('http://localhost:8081/api/salud', headers={'X-API-Key': os.environ['SENSOR_API_KEY']}); urllib.request.urlopen(r)"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cebollita}:${POSTGRES_PASSWORD:-cebollita_dev}@db:5432/${POSTGRES_DB:-cebollita}
      APP_API_KEY: ${APP_API_KEY:-change-me}
      SENSOR_API_KEY: ${SENSOR_API_KEY:-change-me-too}
      SENSOR_DEVICE_URL: ${SENSOR_DEVICE_URL:-http://simulator:8081}
      SENSOR_TIMEOUT_SECONDS: ${SENSOR_TIMEOUT_SECONDS:-20}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

