x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cebollita}:${POSTGRES_PASSWORD:-cebollita_dev}@db:5432/${POSTGRES_DB:-cebollita}
  SENSOR_DEVICE_URL: ${SENSOR_DEVICE_URL:-http://simulator:8081}
  SENSOR_TIMEOUT_SECONDS: ${SENSOR_TIMEOUT_SECONDS:-20}
  REPORT_INTERVAL_MINUTES: ${REPORT_INTERVAL_MINUTES:-30}
  STALE_MARGIN_MINUTES: ${STALE_MARGIN_MINUTES:-10}
  ALERT_REPEAT_MINUTES: ${ALERT_REPEAT_MINUTES:-180}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cebollita}
      POSTGRES_USER: ${POSTGRES_USER:-cebollita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cebollita_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cebollita} -d ${POSTGRES_DB:-cebollita}"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "src.simulator:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/salud')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Medicion automatica + reporte + alertas cada REPORT_INTERVAL_MINUTES.
  # Una sola instancia (advisory lock en PostgreSQL).
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "src.jobs.sensor_report_job"]
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # Bot de Telegram (polling). Requiere TELEGRAM_BOT_TOKEN.
  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "src.bot_telegram.main"]
    environment: *backend-env
    restart: unless-stopped
    profiles: ["telegram"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
